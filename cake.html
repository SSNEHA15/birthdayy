function startCountdown(){

let number=3;

number--;

if(number>0){

text.innerHTML=number;

}

else{

clearInterval(timer);

text.innerHTML="🎉 HAPPY BIRTHDAY 🎉";

document.getElementById("next").style.display="inline-block";

}

},1000);

}

</script>
